<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes - API Client</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <header>
        <h1>QuickNotes</h1>
        <p>A simple notes app powered by an API.</p>
    </header>

    <main>
        <section class="panel">
            <h2>Load Notes</h2>
            <p>Retrieve notes from the server.</p>

            <button id="load-btn" type="button">Load notes</button>

            <p id="status" role="status" aria-live="polite">
                Click Load notes to get started.
            </p>
        </section>

        <section class="panel">
            <h2>Create a Note</h2>

            <form id="note-form">
                <div class="form-group">
                    <label for="title-input">Note title</label>
                    <input
                        type="text"
                        id="title-input"
                        maxlength="100"
                        required
                        placeholder="Enter a note title"
                    >
                    <small>Required. Maximum 100 characters.</small>
                </div>

                <div class="form-group">
                    <label for="body-input">Note body</label>
                    <textarea
                        id="body-input"
                        rows="4"
                        placeholder="Write your note here (optional)"
                    ></textarea>
                </div>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>

        <section class="panel">
            <h2>Your Notes</h2>

            <ul id="notes-list"></ul>
        </section>
    </main>

    <footer>
        <p>QuickNotes System Design Project</p>
    </footer>
</body>
</html>
